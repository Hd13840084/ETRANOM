<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111016">
<title>ETRANOM</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111016;color:#eee9e2;font-family:Tahoma,Arial,sans-serif}#auth-gate{min-height:100dvh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 10%,#382448 0,#17131d 48%,#0c0b10 100%)}.auth-card{width:min(100%,430px);padding:28px 22px;border:1px solid #80613e88;border-radius:18px;background:linear-gradient(145deg,#211a2b,#121016);box-shadow:0 18px 70px #0009}.brand{font-size:34px;letter-spacing:5px;text-align:center;color:#d7b477;margin:8px 0}.sub{color:#bdb2c3;text-align:center;font-size:13px;line-height:2;margin:0 0 24px}.auth-card label{display:block;font-size:13px;color:#d8c8ad;margin:14px 0 7px}.auth-card input{width:100%;padding:14px;border:1px solid #51445c;border-radius:9px;background:#0e0c12;color:#fff;font:inherit;direction:ltr;text-align:left}.auth-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.auth-actions button{padding:13px 8px;border:1px solid #9a794d;border-radius:9px;background:#241d2d;color:#f5e8d1;font:inherit;font-size:13px}.auth-actions button.primary{background:linear-gradient(100deg,#c8a36b,#8c633e);color:#160f12;font-weight:bold}.auth-actions button:disabled{opacity:.55}.auth-note{min-height:42px;margin:16px 0 0;color:#d8c99f;font-size:12px;line-height:1.9;text-align:center}.hidden{display:none!important}
</style>
</head>
<body>
<div id="auth-gate">
  <section class="auth-card">
    <h1 class="brand">ETRANOM</h1>
    <p class="sub">سرزمین‌های بی‌کران<br>برای ورود یا ساخت حساب، ایمیل و گذرواژه‌ات را وارد کن.</p>
    <form id="auth-form">
      <label for="email">ایمیل</label><input id="email" type="email" autocomplete="email" required placeholder="name@example.com">
      <label for="password">گذرواژه</label><input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="حداقل ۶ نویسه">
      <div class="auth-actions"><button class="primary" id="login-btn" type="submit">ورود</button><button id="signup-btn" type="button">ساخت حساب</button></div>
    </form>
    <p id="auth-note" class="auth-note" role="status">اطلاعات حساب در Supabase نگهداری می‌شود.</p>
  </section>
</div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL = 'https://oqqhtctqzffglorurdhg.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_6-jModjPqRglQfAiHJc5iw_9Ifh-VAM';
const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const gate=document.getElementById('auth-gate'),form=document.getElementById('auth-form'),note=document.getElementById('auth-note'),loginBtn=document.getElementById('login-btn'),signupBtn=document.getElementById('signup-btn');
let currentUser=null,started=false;
const say=t=>{note.textContent=t};
function setBusy(v){loginBtn.disabled=v;signupBtn.disabled=v;}
window.lib={
  getUserGameState:async()=>{if(!currentUser)throw new Error('not_authenticated');const {data,error}=await supabase.from('game_saves').select('save_data').eq('user_id',currentUser.id).maybeSingle();if(error)throw error;return data?{state:data.save_data}:null;},
  saveUserGameState:async state=>{if(!currentUser)throw new Error('not_authenticated');const {error}=await supabase.from('game_saves').upsert({user_id:currentUser.id,save_data:state,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;return {success:true};},
  deleteUserGameState:async()=>{if(!currentUser)throw new Error('not_authenticated');const {error}=await supabase.from('game_saves').delete().eq('user_id',currentUser.id);if(error)throw error;return {success:true};}
};
async function start(session){if(started)return;currentUser=session.user;started=true;gate.classList.add('hidden');try{const {run}=await import('./game.js');if(typeof run==='function')run('play');else if(typeof window.run==='function')window.run('play');}catch(e){started=false;gate.classList.remove('hidden');say('بارگذاری بازی ناموفق بود. صفحه را دوباره بارگذاری کن.');console.error(e);}}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;setBusy(true);say('در حال ورود...');try{const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error)throw error;await start(data.session);}catch(e){say(e.message==='Invalid login credentials'?'ایمیل یا گذرواژه نادرست است.':`ورود انجام نشد: ${e.message}`);}finally{setBusy(false);}}
async function signup(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||password.length<6){say('ایمیل معتبر و گذرواژه حداقل ۶ نویسه‌ای وارد کن.');return;}setBusy(true);say('در حال ساخت حساب...');try{const {data,error}=await supabase.auth.signUp({email,password});if(error)throw error;if(data.session)await start(data.session);else say('حساب ساخته شد. ایمیلت را بررسی و لینک تأیید را باز کن؛ سپس با همان ایمیل وارد شو.');}catch(e){say(`ساخت حساب انجام نشد: ${e.message}`);}finally{setBusy(false);}}
form.addEventListener('submit',e=>{e.preventDefault();login();});signupBtn.addEventListener('click',signup);
const {data:{session},error}=await supabase.auth.getSession();if(error)say('بازیابی نشست انجام نشد؛ دوباره وارد شو.');else if(session)await start(session);
</script>
</body>
</html>
