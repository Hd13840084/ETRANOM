<script id="etranom-v2131-diagnostics">
(() => {
  const state = window.__ETRANOM_DIAG_STATE__ = { stage: 'document.head', startedAt: Date.now(), errors: [] };
  const safe = value => { try { return value instanceof Error ? (value.stack || value.message) : typeof value === 'string' ? value : JSON.stringify(value); } catch (_) { return String(value); } };
  function show(title, detail) {
    const message = safe(detail || 'جزئیات خطا در دسترس نیست').slice(0, 12000);
    state.errors.push({ at: new Date().toISOString(), stage: state.stage, title, detail: message });
    let panel = document.getElementById('etranom-v2131-fatal');
    if (!panel) {
      panel = document.createElement('section'); panel.id = 'etranom-v2131-fatal';
      panel.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:block;overflow:auto;padding:18px;background:#100d14;color:#f6e9d4;font:14px/1.8 Tahoma,Arial,sans-serif;direction:rtl';
      (document.body || document.documentElement).appendChild(panel);
    }
    panel.innerHTML = '';
    const heading = document.createElement('h2'); heading.textContent = 'ETRANOM — گزارش خطای اجرای بازی';
    const stage = document.createElement('p'); stage.textContent = 'مرحله: ' + state.stage;
    const why = document.createElement('p'); why.textContent = title;
    const pre = document.createElement('pre'); pre.style.cssText = 'white-space:pre-wrap;overflow-wrap:anywhere;background:#211b29;padding:12px;border:1px solid #896c4b;border-radius:8px;direction:ltr;text-align:left'; pre.textContent = message;
    const copy = document.createElement('button'); copy.textContent = 'کپی گزارش کامل'; copy.style.cssText = 'padding:12px;margin:8px;border-radius:8px';
    copy.onclick = async () => { const report = JSON.stringify({ url: location.href, userAgent: navigator.userAgent, stage: state.stage, elapsedMs: Date.now()-state.startedAt, errors: state.errors }, null, 2); try { await navigator.clipboard.writeText(report); copy.textContent='گزارش کپی شد'; } catch (_) { pre.textContent = report; copy.textContent='گزارش در کادر نمایش داده شد'; } };
    panel.append(heading, stage, why, pre, copy);
  }
  window.__ETRANOM_DIAG__ = { stage(name) { state.stage = String(name); }, show, state };
  window.addEventListener('error', event => {
    if (event.target && event.target !== window) return;
    show('خطای JavaScript: ' + (event.message || 'خطای نامشخص') + (event.filename ? ' — ' + event.filename + ':' + event.lineno + ':' + event.colno : ''), event.error || event.message);
  });
  window.addEventListener('unhandledrejection', event => show('Promise بدون مدیریت خطا رد شد', event.reason));
  window.addEventListener('DOMContentLoaded', () => { state.stage = 'dom.ready'; });
})();
</script>
