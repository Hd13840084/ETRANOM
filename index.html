<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111016">
<title>ETRANOM</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111016;color:#eee9e2;font-family:Tahoma,Arial,sans-serif}#auth-gate{min-height:100dvh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 10%,#382448 0,#17131d 48%,#0c0b10 100%)}.auth-card{width:min(100%,430px);padding:28px 22px;border:1px solid #80613e88;border-radius:18px;background:linear-gradient(145deg,#211a2b,#121016);box-shadow:0 18px 70px #0009}.brand{font-size:34px;letter-spacing:5px;text-align:center;color:#d7b477;margin:8px 0}.sub{color:#bdb2c3;text-align:center;font-size:13px;line-height:2;margin:0 0 24px}.auth-card label{display:block;font-size:13px;color:#d8c8ad;margin:14px 0 7px}.auth-card input{width:100%;padding:14px;border:1px solid #51445c;border-radius:9px;background:#0e0c12;color:#fff;font:inherit;direction:ltr;text-align:left}.auth-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.auth-actions button{padding:13px 8px;border:1px solid #9a794d;border-radius:9px;background:#241d2d;color:#f5e8d1;font:inherit;font-size:13px}.auth-actions button.primary{background:linear-gradient(100deg,#c8a36b,#8c633e);color:#160f12;font-weight:bold}.auth-actions button:disabled{opacity:.55}.auth-note{min-height:42px;margin:16px 0 0;color:#d8c99f;font-size:12px;line-height:1.9;text-align:center}.hidden{display:none!important}
</style>
</head>
<body>
<div id="auth-gate">
  <section class="auth-card">
    <h1 class="brand">ETRANOM</h1>
    <p class="sub">سرزمین‌های بی‌کران<br>برای ساخت حساب یا ورود به سرزمین‌های بی‌کران، ایمیل و گذرواژه‌ات را وارد کن.</p>
    <form id="auth-form">
      <label for="email">ایمیل</label><input id="email" type="email" autocomplete="email" required placeholder="name@example.com">
      <label for="password">گذرواژه</label><input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="حداقل ۶ نویسه">
      <div class="auth-actions"><button class="primary" id="login-btn" type="submit">ورود</button><button id="signup-btn" type="button">ساخت حساب</button></div>
    </form>
    <p id="auth-note" class="auth-note" role="status">اطلاعات حساب در Supabase نگهداری می‌شود.</p>
  </section>
</div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL = 'https://oqqhtctqzffglorurdhg.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_6-jModjPqRglQfAiHJc5iw_9Ifh-VAM';
const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
const gate=document.getElementById('auth-gate'),form=document.getElementById('auth-form'),note=document.getElementById('auth-note'),loginBtn=document.getElementById('login-btn'),signupBtn=document.getElementById('signup-btn');
let currentUser=null,started=false;
const say=t=>{note.textContent=t};
function setBusy(v){loginBtn.disabled=v;signupBtn.disabled=v;}
window.lib={
  getUserGameState:async()=>{if(!currentUser)throw new Error('not_authenticated');const {data,error}=await supabase.from('game_saves').select('save_data').eq('user_id',currentUser.id).maybeSingle();if(error)throw error;return data?{state:data.save_data}:null;},
  saveUserGameState:async state=>{if(!currentUser)throw new Error('not_authenticated');const {error}=await supabase.from('game_saves').upsert({user_id:currentUser.id,save_data:state,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;return {success:true};},
  deleteUserGameState:async()=>{if(!currentUser)throw new Error('not_authenticated');const {error}=await supabase.from('game_saves').delete().eq('user_id',currentUser.id);if(error)throw error;return {success:true};},
  signOut:async()=>{const {error}=await supabase.auth.signOut();if(error)throw error;currentUser=null;started=false;return {success:true};},
  getSocialOverview:async()=>{if(!currentUser)throw new Error('not_authenticated');const uid=currentUser.id;const [meReq,inReq,outReq,friendRows]=await Promise.all([
    supabase.from('player_profiles').select('user_id,username,display_name,player_level,player_class,created_at').eq('user_id',uid).maybeSingle(),
    supabase.from('friend_requests').select('id,sender_id,receiver_id,status,created_at').eq('receiver_id',uid).eq('status','pending').order('created_at',{ascending:false}),
    supabase.from('friend_requests').select('id,sender_id,receiver_id,status,created_at').eq('sender_id',uid).eq('status','pending').order('created_at',{ascending:false}),
    supabase.from('friendships').select('user_low,user_high').or(`user_low.eq.${uid},user_high.eq.${uid}`)
  ]);for(const r of [meReq,inReq,outReq,friendRows])if(r.error)throw r.error;const ids=(friendRows.data||[]).map(x=>x.user_low===uid?x.user_high:x.user_low);const profileIds=[...new Set([...ids,...(inReq.data||[]).map(x=>x.sender_id),...(outReq.data||[]).map(x=>x.receiver_id)])];let profiles=[];if(profileIds.length){const p=await supabase.from('player_profiles').select('user_id,username,display_name,player_level,player_class').in('user_id',profileIds);if(p.error)throw p.error;profiles=p.data||[];}const map=Object.fromEntries(profiles.map(p=>[p.user_id,p]));return {me:meReq.data,friends:ids.map(id=>map[id]).filter(Boolean),incoming:(inReq.data||[]).map(x=>({...x,profile:map[x.sender_id]})),outgoing:(outReq.data||[]).map(x=>({...x,profile:map[x.receiver_id]}))};},
  syncSocialProfile:async character=>{if(!currentUser)throw new Error('not_authenticated');const playerName=String(character?.name||'').trim().slice(0,40);if(!playerName)throw new Error('player_name_required');const payload={username:playerName,display_name:playerName,player_level:Math.max(1,Number(character?.level)||1),player_class:String(character?.archetype||character?.class||'نامشخص').slice(0,40),updated_at:new Date().toISOString()};const {data,error}=await supabase.from('player_profiles').update(payload).eq('user_id',currentUser.id).select('user_id').maybeSingle();if(error){if(error.code==='23505')throw new Error('این نام بازیکن قبلاً انتخاب شده است؛ نام دیگری انتخاب کن.');throw error;}if(!data)throw new Error('player_profile_missing');return {success:true,username:playerName,display_name:playerName};},
  searchPlayers:async query=>{if(!currentUser)throw new Error('not_authenticated');const q=String(query||'').trim().replace(/[%,]/g,'');if(q.length<2)return [];const {data,error}=await supabase.from('player_profiles').select('user_id,username,display_name,player_level,player_class').ilike('username',`%${q}%`).neq('user_id',currentUser.id).limit(20);if(error)throw error;return data||[];},
  sendFriendRequest:async target=>{const {data,error}=await supabase.rpc('send_friend_request',{target_user_id:target});if(error)throw error;return data;},
  respondFriendRequest:async(id,accept)=>{const {data,error}=await supabase.rpc('respond_friend_request',{request_id:id,accept_request:!!accept});if(error)throw error;return data;},
  cancelFriendRequest:async id=>{const {data,error}=await supabase.rpc('cancel_friend_request',{request_id:id});if(error)throw error;return data;},
  removeFriend:async id=>{const {data,error}=await supabase.rpc('remove_friend',{other_user_id:id});if(error)throw error;return data;}
};

// ETRANOM social hub: profile, player search, friend requests and friends.
const socialStyle=document.createElement('style');socialStyle.textContent=`#etr-social-launch{position:fixed;z-index:9998;left:14px;bottom:18px;padding:12px 16px;border:1px solid #b99a65;border-radius:12px;background:linear-gradient(135deg,#38283f,#17121d);color:#f1d9aa;font: bold 13px Tahoma;box-shadow:0 6px 22px #0009}#etr-social-overlay{position:fixed;inset:0;z-index:9999;background:#08070beF;display:none;align-items:center;justify-content:center;padding:12px;font-family:Tahoma}#etr-social-card{width:min(720px,100%);max-height:92dvh;overflow:auto;background:linear-gradient(145deg,#211a2b,#111016);border:1px solid #8d7048;border-radius:16px;padding:16px;color:#eee5d7;box-shadow:0 20px 70px #000}#etr-social-card h2{color:#d9b879;margin:0 0 12px}#etr-social-card button,#etr-social-card input{font:inherit}#etr-social-card button{border:1px solid #8e704c;border-radius:8px;background:#302438;color:#f3dfbd;padding:9px 12px;margin:3px}#etr-social-card button.primary{background:#927044;color:#120f12}#etr-social-card input{width:100%;padding:12px;border-radius:8px;border:1px solid #63516d;background:#0d0b11;color:#fff;margin:8px 0;box-sizing:border-box}#etr-social-card .social-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;margin:7px 0;border:1px solid #51443c;border-radius:9px;background:#17141c}#etr-social-card small{color:#b8a78e}#etr-social-card .social-tabs{display:flex;flex-wrap:wrap;border-bottom:1px solid #594b40;padding-bottom:8px;margin-bottom:10px}#etr-social-card .social-body{min-height:170px}`;document.head.appendChild(socialStyle);
const socialOverlay=document.createElement('div');socialOverlay.id='etr-social-overlay';socialOverlay.innerHTML=`<section id="etr-social-card"><header style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>اجتماع بازیکنان ETRANOM</h2><button id="etr-social-close">✕</button></header><nav class="social-tabs"><button data-social-tab="profile">پروفایل من</button><button data-social-tab="search">جست‌وجوی بازیکن</button><button data-social-tab="friends">دوستان</button><button data-social-tab="requests">درخواست‌ها</button></nav><div id="etr-social-status" role="status" style="color:#d7bd86;line-height:1.8"></div><div class="social-body" id="etr-social-body"></div></section>`;document.body.appendChild(socialOverlay);
const socialEsc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let socialOverview=null,socialTab='profile';
function socialStatus(t=''){document.getElementById('etr-social-status').textContent=t;}
function socialOpen(){socialOverlay.style.display='flex';socialTab='profile';loadSocial();}
function socialClose(){socialOverlay.style.display='none';}
async function loadSocial(){const body=document.getElementById('etr-social-body');body.innerHTML='<p>در حال دریافت اطلاعات اجتماعی...</p>';socialStatus('');try{socialOverview=await window.lib.getSocialOverview();renderSocial();}catch(e){body.innerHTML='<p>دریافت اطلاعات ناموفق بود.</p>';socialStatus(e.message||'خطای ارتباط با سرور');}}
function renderSocial(){const b=document.getElementById('etr-social-body'),o=socialOverview||{};if(socialTab==='profile'){const m=o.me||{};b.innerHTML=`<h3>پروفایل بازیکن</h3><div class="social-row"><span>نام کاربری / نام شخصیت</span><b>${socialEsc(m.username||'هنوز ساخته نشده')}</b></div><div class="social-row"><span>سطح</span><b>${Number(m.player_level||1)}</b></div><div class="social-row"><span>کلاس</span><b>${socialEsc(m.player_class||'هنوز ثبت نشده')}</b></div><small>نام کاربری پس از ساخت شخصیت در پروفایل ثبت می‌شود. نام بازیکن باید یکتا باشد.</small>`;return;}if(socialTab==='search'){b.innerHTML=`<h3>جست‌وجوی بازیکنان</h3><input id="etr-social-query" placeholder="نام بازیکن را وارد کن (حداقل ۲ حرف)"><button class="primary" id="etr-social-search">جست‌وجو</button><div id="etr-social-results"></div>`;document.getElementById('etr-social-search').onclick=async()=>{const q=document.getElementById('etr-social-query').value;const out=document.getElementById('etr-social-results');out.innerHTML='<p>در حال جست‌وجو...</p>';try{const rows=await window.lib.searchPlayers(q);out.innerHTML=rows.length?rows.map(x=>`<div class="social-row"><span><b>${socialEsc(x.username)}</b><br><small>سطح ${x.player_level} • ${socialEsc(x.player_class||'نامشخص')}</small></span><button data-social-add="${socialEsc(x.user_id)}">درخواست دوستی</button></div>`).join(''):'<p>بازیکنی با این نام پیدا نشد.</p>';out.querySelectorAll('[data-social-add]').forEach(btn=>btn.onclick=async()=>{btn.disabled=true;try{await window.lib.sendFriendRequest(btn.dataset.socialAdd);socialStatus('درخواست دوستی ارسال شد.');btn.textContent='ارسال شد';}catch(e){btn.disabled=false;socialStatus(e.message||'ارسال درخواست ناموفق بود.');}});}catch(e){out.textContent='خطا در جست‌وجو: '+e.message;}};return;}if(socialTab==='friends'){b.innerHTML='<h3>فهرست دوستان</h3>'+((o.friends||[]).length?(o.friends||[]).map(x=>`<div class="social-row"><span><b>${socialEsc(x.username)}</b><br><small>سطح ${x.player_level} • ${socialEsc(x.player_class||'نامشخص')}</small></span><button data-social-remove="${socialEsc(x.user_id)}">حذف از دوستان</button></div>`).join(''):'<p>هنوز دوستی ثبت نشده است.</p>');b.querySelectorAll('[data-social-remove]').forEach(btn=>btn.onclick=async()=>{if(!confirm('این بازیکن از فهرست دوستان حذف شود؟'))return;try{await window.lib.removeFriend(btn.dataset.socialRemove);await loadSocial();}catch(e){socialStatus(e.message);}});return;}if(socialTab==='requests'){const incoming=o.incoming||[],outgoing=o.outgoing||[];b.innerHTML='<h3>درخواست‌های دریافتی</h3>'+(incoming.length?incoming.map(x=>`<div class="social-row"><span><b>${socialEsc(x.profile?.username||'بازیکن')}</b><br><small>درخواست دوستی</small></span><span><button data-social-accept="${socialEsc(x.id)}">پذیرفتن</button><button data-social-reject="${socialEsc(x.id)}">رد</button></span></div>`).join(''):'<p>درخواست دریافتی نداری.</p>')+'<h3>درخواست‌های ارسالی</h3>'+(outgoing.length?outgoing.map(x=>`<div class="social-row"><span>${socialEsc(x.profile?.username||'بازیکن')}</span><button data-social-cancel="${socialEsc(x.id)}">لغو درخواست</button></div>`).join(''):'<p>درخواست ارسالی نداری.</p>');b.querySelectorAll('[data-social-accept],[data-social-reject]').forEach(btn=>btn.onclick=async()=>{try{await window.lib.respondFriendRequest(btn.dataset.socialAccept||btn.dataset.socialReject,!!btn.dataset.socialAccept);await loadSocial();}catch(e){socialStatus(e.message);}});b.querySelectorAll('[data-social-cancel]').forEach(btn=>btn.onclick=async()=>{try{await window.lib.cancelFriendRequest(btn.dataset.socialCancel);await loadSocial();}catch(e){socialStatus(e.message);}});}}
document.getElementById('etr-social-close').onclick=socialClose;socialOverlay.addEventListener('click',e=>{if(e.target===socialOverlay)socialClose();});socialOverlay.querySelectorAll('[data-social-tab]').forEach(btn=>btn.onclick=()=>{socialTab=btn.dataset.socialTab;renderSocial();});
const socialLaunch=document.createElement('button');socialLaunch.id='etr-social-launch';socialLaunch.textContent='♧ اجتماع بازیکنان';socialLaunch.onclick=socialOpen;

async function start(session){if(started)return;currentUser=session.user;started=true;gate.classList.add('hidden');if(!socialLaunch.isConnected)document.body.appendChild(socialLaunch);try{const {run}=await import('./game.js');if(typeof run==='function')run('play');else if(typeof window.run==='function')window.run('play');}catch(e){started=false;gate.classList.remove('hidden');say('بارگذاری بازی ناموفق بود. صفحه را دوباره بارگذاری کن.');console.error(e);}}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;setBusy(true);say('در حال ورود...');try{const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error)throw error;await start(data.session);}catch(e){say(e.message==='Invalid login credentials'?'ایمیل یا گذرواژه نادرست است.':`ورود انجام نشد: ${e.message}`);}finally{setBusy(false);}}
async function signup(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||password.length<6){say('ایمیل معتبر و گذرواژه حداقل ۶ نویسه‌ای وارد کن.');return;}setBusy(true);say('در حال ساخت حساب...');try{const {data,error}=await supabase.auth.signUp({email,password});if(error)throw error;if(data.session)await start(data.session);else say('حساب ساخته شد، اما نشست ورود دریافت نشد. تنظیم تأیید ایمیل را بررسی کن یا با همان ایمیل و گذرواژه وارد شو.');}catch(e){say(`ساخت حساب انجام نشد: ${e.message}`);}finally{setBusy(false);}}
form.addEventListener('submit',e=>{e.preventDefault();login();});signupBtn.addEventListener('click',signup);
supabase.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){started=false;currentUser=null;window.location.reload();}});
const {data:{session},error}=await supabase.auth.getSession();if(error){say('بازیابی نشست انجام نشد؛ ایمیل و گذرواژه را وارد کن.');}else if(session){const {data:{user},error:verifyError}=await supabase.auth.getUser();if(!verifyError&&user&&user.id===session.user.id){await start({...session,user});}else{await supabase.auth.signOut({scope:'local'});currentUser=null;started=false;say('نشست قبلی معتبر نیست. برای ورود، ایمیل و گذرواژه را وارد کن.');}}
</script>
</body>
</html>
