<script type="module">
let createClient;

  ({ createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'));

    ({ createClient } = await import('https://esm.sh/@supabase/supabase-js@2'));

    throw secondError;
  }
}
const SUPABASE_URL = 'https://oqqhtctqzffglorurdhg.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_6-jModjPqRglQfAiHJc5iw_9Ifh-VAM';

const guildCss=document.createElement('style');guildCss.textContent=`#etr-guild-launch{position:fixed;z-index:100002;right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));padding:12px 18px;border:1px solid #b99a65;border-radius:12px;background:linear-gradient(135deg,#29203a,#15121b);color:#f1d9aa;font:bold 13px Tahoma;box-shadow:0 6px 22px #0009}#etr-guild-overlay{position:fixed;inset:0;z-index:100006;background:#08070bf0;display:none;align-items:center;justify-content:center;padding:12px;font-family:Tahoma}#etr-guild-card{width:min(680px,100%);max-height:92dvh;overflow:auto;background:linear-gradient(145deg,#211a2b,#111016);border:1px solid #9b7a4e;border-radius:16px;padding:17px;color:#eee5d7;box-shadow:0 20px 70px #000}#etr-guild-card h2,#etr-guild-card h3{color:#d9b879}#etr-guild-card button,#etr-guild-card input,#etr-guild-card textarea{font:inherit}#etr-guild-card button{border:1px solid #8e704c;border-radius:8px;background:#302438;color:#f3dfbd;padding:9px 12px;margin:4px}#etr-guild-card button.primary{background:#927044;color:#120f12;font-weight:bold}#etr-guild-card input,#etr-guild-card textarea{width:100%;padding:11px;border-radius:8px;border:1px solid #63516d;background:#0d0b11;color:#fff;margin:6px 0;box-sizing:border-box}#etr-guild-card .guild-box{padding:12px;margin:9px 0;border:1px solid #51443c;border-radius:10px;background:#17141c}#etr-guild-card .guild-muted{color:#b8a78e;font-size:12px;line-height:1.9}#etr-guild-card .guild-row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px;border-bottom:1px solid #403747}#etr-guild-card .guild-error{color:#ffaaa3;line-height:1.8}`;document.head.appendChild(guildCss);
const guildOverlay=document.createElement('div');guildOverlay.id='etr-guild-overlay';guildOverlay.innerHTML=`<section id="etr-guild-card" role="dialog" aria-modal="true" aria-label="انجمن‌ها"><header style="display:flex;justify-content:space-between;align-items:center"><div><small style="color:#b99a65">ETRANOM • GUILD HALL</small><h2 style="margin:5px 0">انجمن‌ها</h2></div><button id="etr-guild-close">✕</button></header><div id="etr-guild-content">در حال بارگذاری...</div></section>`;document.body.appendChild(guildOverlay);

function guildEscape(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function guildMessage(t,error=false){const el=document.getElementById('etr-guild-feedback');if(el){el.textContent=t;el.className=error?'guild-error':'guild-muted';}}
async function guildRpc(name,args={}){const {data,error}=await supabase.rpc(name,args);if(error)throw error;return data;}
async function renderGuildPanel(){const box=document.getElementById('etr-guild-content');box.innerHTML='<p>در حال دریافت اطلاعات انجمن...</p>';try{const snap=await guildRpc('etranom_guild_snapshot');const g=snap.guild;let html='';
 if(g){html+=`<div class="guild-box"><div style="display:flex;justify-content:space-between;gap:10px"><div><small class="guild-muted">نشان انجمن • [${guildEscape(g.tag)}]</small><h3 style="margin:5px 0">${guildEscape(g.name)}</h3></div><b style="color:#d8b879">سطح ${g.level}</b></div><p class="guild-muted">${guildEscape(g.description||'بدون توضیحات')}</p><div class="guild-row"><span>اعضا</span><b>${snap.members.length} / ${g.member_limit}</b></div><div class="guild-row"><span>تأسیس</span><b>${new Date(g.created_at).toLocaleDateString('fa-IR')}</b></div></div><h3>اعضای انجمن</h3>`;
 html+=(snap.members||[]).map(m=>`<div class="guild-row"><span><b>${guildEscape(m.display_name)}</b><br><small class="guild-muted">سطح ${m.player_level} • ${guildEscape(m.player_class)}</small></span><b>${m.role==='leader'?'رهبر':m.role==='officer'?'افسر':'عضو'}</b></div>`).join('');
 html+=`<div class="guild-box guild-chat-box"><h3>💬 گفت‌وگوی اختصاصی انجمن</h3><p class="guild-muted">این کانال فقط برای اعضای همین انجمن قابل مشاهده است.</p><div id="guild-chat-messages" style="height:220px;overflow:auto;padding:8px;background:#0d0b11;border-radius:8px" aria-live="polite">در حال دریافت پیام‌ها...</div><form id="guild-chat-form" style="display:flex;gap:6px;margin-top:8px"><input name="body" maxlength="1000" placeholder="پیام برای اعضای انجمن..." required style="flex:1;min-width:0"><button class="primary" type="submit">ارسال</button></form></div>`;
 if(g.leader_id===currentUser.id || (snap.members||[]).some(m=>m.user_id===currentUser.id&&m.role==='officer')) html+=`<div class="guild-box"><h3>دعوت بازیکن</h3><input id="guild-player-search" placeholder="نام بازیکن را جست‌وجو کن"><div id="guild-search-results"></div></div>`;
 html+=`<button id="guild-leave">${g.leader_id===currentUser.id&&snap.members.length===1?'انحلال انجمن':'خروج از انجمن'}</button>`;
 }else{html+=`<div class="guild-box"><h3>هنوز عضو هیچ انجمنی نیستی</h3><p class="guild-muted">برای ساخت انجمن باید ابتدا در شهر خاکستر به تالار انجمن بروی و با تورِن، استاد انجمن، صحبت کنی. پس از تأیید او، هزینه ثبت رسمی ۱۰۰۰ سکه از ذخیره بازی کسر می‌شود.</p><p style="color:${guildTeacherVisited?'#9bd6a4':'#e6b77b'}">${guildTeacherVisited?'✓ تأیید تورِن ثبت شد؛ امکان تأسیس انجمن فعال است.':'قفل تأسیس: دیدار با تورِن لازم است.'}</p>${guildTeacherVisited?`<h3>ثبت انجمن جدید</h3><input id="guild-name" maxlength="32" placeholder="نام انجمن (۳ تا ۳۲ نویسه)"><input id="guild-tag" maxlength="5" placeholder="نشان کوتاه لاتین (۲ تا ۵ حرف/عدد)"><textarea id="guild-description" maxlength="240" rows="3" placeholder="معرفی انجمن (اختیاری)"></textarea><button class="primary" id="guild-create">پرداخت ۱۰۰۰ سکه و تأسیس انجمن</button>`:`<button id="guild-go-teacher">راهنمای رسیدن به تورِن</button>`}</div>`;}
 if((snap.invites||[]).length){html+='<h3>دعوت‌نامه‌های دریافتی</h3>'+(snap.invites||[]).map(i=>`<div class="guild-row"><span><b>${guildEscape(i.guild_name)}</b> [${guildEscape(i.guild_tag)}]<br><small class="guild-muted">دعوت از سوی انجمن</small></span><span><button data-guild-accept="${i.id}">پذیرفتن</button><button data-guild-decline="${i.id}">رد</button></span></div>`).join('');}
 html+='<p id="etr-guild-feedback" class="guild-muted" role="status"></p>';box.innerHTML=html;
 if(g){initGuildChat(g.id);}
 document.getElementById('guild-go-teacher')?.addEventListener('click',()=>{guildMessage('به تالار انجمن ماجراجویان در شهر خاکستر برو و با تورِن، استاد انجمن، تعامل کن.');});
 document.getElementById('guild-create')?.addEventListener('click',async()=>{const name=document.getElementById('guild-name').value.trim(),tag=document.getElementById('guild-tag').value.trim(),description=document.getElementById('guild-description').value.trim();try{await guildRpc('etranom_guild_create',{p_name:name,p_tag:tag,p_description:description});guildMessage('انجمن با موفقیت تأسیس شد؛ ۱۰۰۰ سکه از ذخیره بازی کسر شد.');await renderGuildPanel();}catch(e){guildMessage(guildErrorFa(e.message),true);}});
 document.getElementById('guild-leave')?.addEventListener('click',async()=>{if(!confirm('از انجمن خارج شوی؟ اگر رهبر تنها عضو باشد، انجمن منحل می‌شود.'))return;try{await guildRpc('etranom_guild_leave');await renderGuildPanel();}catch(e){guildMessage(guildErrorFa(e.message),true);}});
 const search=document.getElementById('guild-player-search');if(search){let timer;search.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(async()=>{const q=search.value.trim();if(q.length<2)return;const {data,error}=await supabase.from('player_profiles').select('user_id,display_name,username,player_level').or(`display_name.ilike.%${q}%,username.ilike.%${q}%`).neq('user_id',currentUser.id).limit(8);const out=document.getElementById('guild-search-results');if(error){out.textContent='جست‌وجو ناموفق بود.';return;}out.innerHTML=(data||[]).map(p=>`<div class="guild-row"><span>${guildEscape(p.display_name||p.username)} • سطح ${p.player_level}</span><button data-guild-invite="${p.user_id}">دعوت</button></div>`).join('')||'<small class="guild-muted">بازیکنی پیدا نشد.</small>';out.querySelectorAll('[data-guild-invite]').forEach(b=>b.onclick=async()=>{try{await guildRpc('etranom_guild_invite',{p_target:b.dataset.guildInvite});b.textContent='دعوت شد';b.disabled=true;}catch(e){guildMessage(guildErrorFa(e.message),true);}});},350);});}
 box.querySelectorAll('[data-guild-accept],[data-guild-decline]').forEach(b=>b.onclick=async()=>{try{await guildRpc('etranom_guild_respond_invite',{p_invite:b.dataset.guildAccept||b.dataset.guildDecline,p_accept:!!b.dataset.guildAccept});await renderGuildPanel();}catch(e){guildMessage(guildErrorFa(e.message),true);}});
 }catch(e){box.innerHTML=`<p class="guild-error">سیستم انجمن در دسترس نیست: ${guildEscape(guildErrorFa(e.message))}</p><p class="guild-muted">ابتدا فایل database/guilds_phase3.sql را در SQL Editor اجرا کن.</p>`;}}
let guildChatChannel=null;
async function initGuildChat(guildId){
 const area=document.getElementById('guild-chat-messages'),form=document.getElementById('guild-chat-form');if(!area||!form)return;
 if(guildChatChannel){await supabase.removeChannel(guildChatChannel).catch(()=>{});guildChatChannel=null;}
 const esc=guildEscape;
 const render=rows=>{area.innerHTML=rows.length?rows.map(m=>`<div data-guild-message="${esc(m.id)}" style="padding:7px 4px;border-bottom:1px solid #342b3b"><b>${esc(m.sender_name||'عضو انجمن')}</b><p style="margin:5px 0;white-space:pre-wrap;overflow-wrap:anywhere">${esc(m.body)}</p><small class="guild-muted">${new Date(m.created_at).toLocaleString('fa-IR')}</small></div>`).join(''):'<p class="guild-muted">هنوز پیامی در گفت‌وگوی انجمن نیست. اولین پیام را بفرست.</p>';area.scrollTop=area.scrollHeight;};
 const load=async()=>{const {data,error}=await supabase.from('guild_messages').select('id,sender_id,body,created_at').eq('guild_id',guildId).order('created_at',{ascending:true}).limit(100);if(error){area.textContent='دریافت پیام‌ها ناموفق بود: '+error.message;return;}const ids=[...new Set((data||[]).map(x=>x.sender_id))];let profiles=[];if(ids.length){const r=await supabase.from('player_profiles').select('user_id,display_name,username').in('user_id',ids);profiles=r.data||[];}const names=Object.fromEntries(profiles.map(x=>[x.user_id,x.display_name||x.username||'عضو انجمن']));render((data||[]).map(x=>({...x,sender_name:names[x.sender_id]||'عضو انجمن'})));};
 await load();guildChatChannel=supabase.channel('etranom:guild-chat:'+guildId).on('postgres_changes',{event:'INSERT',schema:'public',table:'guild_messages',filter:`guild_id=eq.${guildId}`},async payload=>{const row=payload.new;if(!row)return;const {data:p}=await supabase.from('player_profiles').select('display_name,username').eq('user_id',row.sender_id).maybeSingle();if(area.querySelector(`[data-guild-message="${row.id}"]`))return;const article=document.createElement('div');article.dataset.guildMessage=row.id;article.style.cssText='padding:7px 4px;border-bottom:1px solid #342b3b';article.innerHTML=`<b>${esc(p?.display_name||p?.username||'عضو انجمن')}</b><p style="margin:5px 0;white-space:pre-wrap;overflow-wrap:anywhere">${esc(row.body)}</p><small class="guild-muted">${new Date(row.created_at).toLocaleString('fa-IR')}</small>`;if(area.querySelector('.guild-muted')&&area.textContent.includes('هنوز پیامی'))area.innerHTML='';area.appendChild(article);area.scrollTop=area.scrollHeight;}).subscribe();
 form.onsubmit=async e=>{e.preventDefault();const input=form.elements.body,body=String(input.value||'').trim();if(!body||body.length>1000)return;const button=form.querySelector('button');button.disabled=true;try{const {error}=await supabase.from('guild_messages').insert({guild_id:guildId,sender_id:currentUser.id,body});if(error)throw error;input.value='';await load();}catch(err){guildMessage('ارسال پیام ناموفق بود: '+err.message,true);}finally{button.disabled=false;input.focus();}};
}
function guildErrorFa(m){const s=String(m||'');const map={guild_name_length:'نام انجمن باید بین ۳ تا ۳۲ نویسه باشد.',guild_tag_length:'نشان انجمن باید بین ۲ تا ۵ حرف یا عدد باشد.',already_in_guild:'در حال حاضر عضو یک انجمن هستی.',guild_fee_insufficient:'برای تأسیس انجمن حداقل ۱۰۰۰ سکه نیاز داری.',guild_name_or_tag_taken:'این نام یا نشان قبلاً ثبت شده است.',game_save_missing:'ابتدا شخصیتت را ذخیره کن و دوباره تلاش کن.',guild_permission_denied:'فقط رهبر یا افسر انجمن می‌تواند دعوت بفرستد.',target_unavailable:'این بازیکن عضو انجمن است یا قابل دعوت نیست.',guild_full:'ظرفیت انجمن تکمیل شده است.',invite_not_found:'دعوت‌نامه معتبر پیدا نشد.',not_in_guild:'عضو انجمنی نیستی.'};for(const [k,v] of Object.entries(map))if(s.includes(k))return v;return s;}
function openGuildPanel(){guildOverlay.style.display='flex';renderGuildPanel();}
guildLaunch.addEventListener('click',openGuildPanel);guildOverlay.addEventListener('click',e=>{if(e.target===guildOverlay)guildOverlay.style.display='none';});document.getElementById('etr-guild-close').onclick=()=>guildOverlay.style.display='none';
document.addEventListener('click',e=>{const b=e.target.closest('[data-guild-master-open]');if(b){guildTeacherVisited=true;sessionStorage.setItem('etranom:guildTeacherVisited','1');openGuildPanel();}});

const say=t=>{note.textContent=t};
function setBusy(v){loginBtn.disabled=v;signupBtn.disabled=v;}
window.lib={
  getUserGameState:async()=>{if(!currentUser)throw new Error('not_authenticated');const {data,error}=await supabase.from('game_saves').select('save_data').eq('user_id',currentUser.id).maybeSingle();if(error)throw error;return data?{state:data.save_data}:null;},
  saveUserGameState:async state=>{if(!currentUser)throw new Error('not_authenticated');const {error}=await supabase.from('game_saves').upsert({user_id:currentUser.id,save_data:state,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;return {success:true};},
  deleteUserGameState:async()=>{if(!currentUser)throw new Error('not_authenticated');const {error}=await supabase.from('game_saves').delete().eq('user_id',currentUser.id);if(error)throw error;return {success:true};},
  signOut:async()=>{if(window.etranomPresence)await window.etranomPresence.stop();const {error}=await supabase.auth.signOut({scope:'local'});if(error)throw error;currentUser=null;started=false;return {success:true};},
  getSocialOverview:async()=>{if(!currentUser)throw new Error('not_authenticated');const uid=currentUser.id;const [meReq,inReq,outReq,friendRows]=await Promise.all([
    supabase.from('player_profiles').select('user_id,username,display_name,player_level,player_class,created_at').eq('user_id',uid).maybeSingle(),
    supabase.from('friend_requests').select('id,sender_id,receiver_id,status,created_at').eq('receiver_id',uid).eq('status','pending').order('created_at',{ascending:false}),

async function renderSocialLeaderboard(board=1){const box=document.getElementById('etr-social-leaderboard-results');if(!box)return;box.innerHTML='<p>در حال دریافت جدول رتبه‌بندی...</p>';try{const result=await window.lib.leaderboard(board);if(!result.available){box.innerHTML=`<p class="social-error">${socialEsc(result.reason||'این جدول هنوز داده معتبر ندارد.')}</p>`;return;}box.innerHTML=(result.rows||[]).map((row,i)=>`<div class="social-row"><span>${i+1}. ${socialEsc(row.name)}</span><b>${socialEsc(row.value)} ${row.detail?`<small>${socialEsc(row.detail)}</small>`:''}</b></div>`).join('')||'<p>هنوز داده‌ای برای این جدول ثبت نشده است.</p>';}catch(error){box.innerHTML=`<p class="social-error">دریافت رتبه‌بندی ناموفق بود: ${socialEsc(error.message)}</p>`;}}
function renderSocial(){const b=document.getElementById('etr-social-body'),o=socialOverview||{};if(socialTab==='leaderboards'){b.innerHTML=`<h3>🏆 رتبه‌بندی جهان ETRANOM</h3><p><small>جایگاه ماجراجویان و انجمن‌ها در جهان را در ده جدول دنبال کن.</small></p><div style="display:flex;gap:6px;flex-wrap:wrap">${socialLeaderboards.map(([name,id])=>`<button type="button" data-social-board="${id}">${name}</button>`).join('')}</div><div id="etr-social-leaderboard-results" style="margin-top:12px">یک جدول را انتخاب کن.</div>`;b.querySelectorAll('[data-social-board]').forEach(button=>button.addEventListener('click',()=>renderSocialLeaderboard(Number(button.dataset.socialBoard))));return;}if(socialTab==='chat'){openPrivateChat();return;}if(socialTab==='global-chat'){openGlobalChat();return;}if(socialTab==='party'){openPartyTab();return;}if(socialTab==='profile'){const m=o.me||{};b.innerHTML=`<h3>پروفایل بازیکن</h3><div class="social-row"><span>نام کاربری / نام شخصیت</span><b>${socialEsc(socialName(m))}</b></div><div class="social-row"><span>سطح</span><b>${Number(m.player_level||1)}</b></div><div class="social-row"><span>کلاس</span><b>${socialEsc(m.player_class||'هنوز ثبت نشده')}</b></div><small>نام کاربری پس از ساخت شخصیت در پروفایل ثبت می‌شود. نام بازیکن باید یکتا باشد.</small>`;return;}if(socialTab==='search'){b.innerHTML=`<h3>جست‌وجوی بازیکنان</h3><input id="etr-social-query" placeholder="نام بازیکن را وارد کن (حداقل ۲ حرف)"><button class="primary" id="etr-social-search">جست‌وجو</button><div id="etr-social-results"></div>`;document.getElementById('etr-social-search').onclick=async()=>{const q=document.getElementById('etr-social-query').value;const out=document.getElementById('etr-social-results');out.innerHTML='<p>در حال جست‌وجو...</p>';try{const rows=await window.lib.searchPlayers(q);out.innerHTML=rows.length?rows.map(x=>`<div class="social-row"><span><b>${socialEsc(socialName(x))}</b><br><small>سطح ${x.player_level} • ${socialEsc(x.player_class||'نامشخص')}</small></span><button data-social-add="${socialEsc(x.user_id)}">درخواست دوستی</button></div>`).join(''):'<p>بازیکنی با این نام پیدا نشد.</p>';out.querySelectorAll('[data-social-add]').forEach(btn=>btn.onclick=async()=>{btn.disabled=true;try{await window.lib.sendFriendRequest(btn.dataset.socialAdd);socialStatus('درخواست دوستی ارسال شد.');btn.textContent='ارسال شد';}catch(e){btn.disabled=false;socialStatus(e.message||'ارسال درخواست ناموفق بود.');}});}catch(e){out.textContent='خطا در جست‌وجو: '+e.message;}};return;}if(socialTab==='friends'){b.innerHTML='<h3>فهرست دوستان</h3>'+((o.friends||[]).length?[...(o.friends||[])].sort((a,b)=>Number(window.etranomPresence?.isOnline(b.user_id)||false)-Number(window.etranomPresence?.isOnline(a.user_id)||false)).map(x=>{const presence=socialPresenceLabel(x.user_id);return `<div class="social-row"><span><b>${socialEsc(socialName(x))}</b><br><small>سطح ${x.player_level} • ${socialEsc(x.player_class||'نامشخص')} • <span class="etr-friend-presence ${presence.state}">${presence.label}</span></small></span><button data-social-remove="${socialEsc(x.user_id)}">حذف از دوستان</button></div>`;}).join(''):'<p>هنوز دوستی ثبت نشده است.</p>');b.querySelectorAll('[data-social-remove]').forEach(btn=>btn.onclick=async()=>{if(!confirm('این بازیکن از فهرست دوستان حذف شود؟'))return;try{await window.lib.removeFriend(btn.dataset.socialRemove);await loadSocial();}catch(e){socialStatus(e.message);}});return;}if(socialTab==='requests'){markNotificationsRead('requests');const incoming=o.incoming||[],outgoing=o.outgoing||[];b.innerHTML='<h3>درخواست‌های دریافتی</h3>'+(incoming.length?incoming.map(x=>`<div class="social-row"><span><b>${socialEsc(socialName(x.profile))}</b><br><small>درخواست دوستی</small></span><span><button data-social-accept="${socialEsc(x.id)}">پذیرفتن</button><button data-social-reject="${socialEsc(x.id)}">رد</button></span></div>`).join(''):'<p>درخواست دریافتی نداری.</p>')+'<h3>درخواست‌های ارسالی</h3>'+(outgoing.length?outgoing.map(x=>`<div class="social-row"><span>${socialEsc(socialName(x.profile))}</span><button data-social-cancel="${socialEsc(x.id)}">لغو درخواست</button></div>`).join(''):'<p>درخواست ارسالی نداری.</p>');b.querySelectorAll('[data-social-accept],[data-social-reject]').forEach(btn=>btn.onclick=async()=>{try{await window.lib.respondFriendRequest(btn.dataset.socialAccept||btn.dataset.socialReject,!!btn.dataset.socialAccept);await loadSocial();}catch(e){socialStatus(e.message);}});b.querySelectorAll('[data-social-cancel]').forEach(btn=>btn.onclick=async()=>{try{await window.lib.cancelFriendRequest(btn.dataset.socialCancel);await loadSocial();}catch(e){socialStatus(e.message);}});}}
document.getElementById('etr-social-close').onclick=socialClose;socialOverlay.addEventListener('click',e=>{if(e.target===socialOverlay)socialClose();});socialOverlay.querySelectorAll('[data-social-tab]').forEach(btn=>btn.onclick=async()=>{socialTab=btn.dataset.socialTab;if(socialTab!=='chat'&&privateChatSystem){await privateChatSystem.destroy();privateChatSystem=null;}if(socialTab!=='global-chat'&&globalChatSystem){await globalChatSystem.destroy();globalChatSystem=null;}if(socialTab==='party')openPartyTab();else if(socialTab==='chat')openPrivateChat();else if(socialTab==='global-chat')openGlobalChat();else renderSocial();});
const socialLaunch=document.createElement('button');socialLaunch.id='etr-social-launch';socialLaunch.innerHTML='♧ اجتماع بازیکنان <span class="etr-badge" data-badge="total" hidden></span>';socialLaunch.onclick=socialOpen;
const notificationCounts={private:0,global:0,requests:0,party:0};let notificationChannels=[],notificationReady=false;
const badgeValue=n=>n>99?'99+':String(Math.max(0,n));
function updateNotificationBadges(){const total=Object.values(notificationCounts).reduce((a,b)=>a+b,0);for(const [key,count] of Object.entries({...notificationCounts,total})){document.querySelectorAll(`[data-badge="${key}"]`).forEach(el=>{el.textContent=badgeValue(count);el.hidden=count<=0;});}}
function setNotificationCount(key,value){notificationCounts[key]=Math.max(0,Number(value)||0);updateNotificationBadges();}
function bumpNotification(key,amount=1){setNotificationCount(key,notificationCounts[key]+amount);}
function noticeKey(kind){return `etranom:${kind}:lastSeen:${currentUser?.id||'guest'}`;}
async function refreshNotificationCounts(){if(!currentUser)return;try{const sincePrivate=localStorage.getItem(noticeKey('private'))||new Date(0).toISOString();const sinceGlobal=localStorage.getItem(noticeKey('global'))||new Date(0).toISOString();const [pm,gm,fr,pi]=await Promise.all([
supabase.from('private_messages').select('id',{count:'exact',head:true}).eq('receiver_id',currentUser.id).gt('created_at',sincePrivate),
supabase.from('global_messages').select('id',{count:'exact',head:true}).neq('sender_id',currentUser.id).gt('created_at',sinceGlobal),
supabase.from('friend_requests').select('id',{count:'exact',head:true}).eq('receiver_id',currentUser.id).eq('status','pending'),
supabase.rpc('get_party_invites')
]);if(!pm.error)setNotificationCount('private',pm.count||0);if(!gm.error)setNotificationCount('global',gm.count||0);if(!fr.error)setNotificationCount('requests',fr.count||0);if(!pi.error)setNotificationCount('party',Array.isArray(pi.data)?pi.data.length:0);}catch(e){console.warn('[ETRANOM] Notification counts unavailable:',e);}}
function startNotificationRealtime(){notificationChannels.forEach(c=>supabase.removeChannel(c).catch(()=>{}));notificationChannels=[];const specs=[['private_messages','private',`receiver_id=eq.${currentUser.id}`],['global_messages','global',null],['friend_requests','requests',`receiver_id=eq.${currentUser.id}`],['party_invites','party',`receiver_id=eq.${currentUser.id}`]];for(const [table,key,filter] of specs){let q=supabase.channel(`etr-notify:${currentUser.id}:${table}`).on('postgres_changes',{event:'INSERT',schema:'public',table,...(filter?{filter}:{})},payload=>{const row=payload.new||{};if(table==='global_messages'&&row.sender_id===currentUser.id)return;if(table==='party_invites'&&row.expires_at&&new Date(row.expires_at)<new Date())return;if((socialTab==='chat'&&key==='private')||(socialTab==='global-chat'&&key==='global'))return;bumpNotification(key);if(!socialOverlay || socialOverlay.style.display!=='flex')showToastNotification(key);}).subscribe();notificationChannels.push(q);}}
function showToastNotification(key){const labels={private:'پیام خصوصی جدید دریافت کردی',global:'پیام تازه‌ای در چت جهانی',requests:'درخواست دوستی جدید داری',party:'دعوت جدید گروه ماجراجویان داری'};let toast=document.getElementById('etr-notification-toast');if(!toast){toast=document.createElement('div');toast.id='etr-notification-toast';toast.style.cssText='position:fixed;z-index:100010;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);max-width:90vw;padding:11px 16px;border:1px solid #a7834f;border-radius:12px;background:#241a2c;color:#f4dfb6;box-shadow:0 8px 28px #000b;font:13px Tahoma;text-align:center';document.body.appendChild(toast);}toast.textContent=labels[key]||'اعلان جدید';toast.style.display='block';clearTimeout(toast._timer);toast._timer=setTimeout(()=>toast.style.display='none',4200);}
function markNotificationsRead(key){localStorage.setItem(noticeKey(key),new Date().toISOString());setNotificationCount(key,0);}


async function startSession(session){
  if(started)return;
  if(!session?.user?.id)throw new Error('نشست کاربری معتبر نیست.');
  currentUser=session.user;
  let gameRoot=document.getElementById('etr-game-root');
  if(!gameRoot){gameRoot=document.createElement('main');gameRoot.id='etr-game-root';gameRoot.style.minHeight='100vh';document.body.appendChild(gameRoot);}
  gameRoot.classList.remove('etr-game-ready');
  gameRoot.replaceChildren();
  gate.classList.remove('hidden');
  try{
    try{const {ETRANOMMarketplaceUI}=await import('./systems/marketplace/marketplace-ui.js');const marketUI=new ETRANOMMarketplaceUI({api:window.lib});window.etranomOpenMarket=()=>marketUI.open();}
    catch(e){console.warn('[ETRANOM] Marketplace UI unavailable:',e);window.etranomOpenMarket=()=>alert('بازار آنلاین هنوز بارگذاری نشده است.');}
    try{const {ETRANOMPvPUI}=await import('./systems/pvp/pvp-ui.js');const pvpUI=new ETRANOMPvPUI(window.lib);window.etranomOpenPvP=()=>pvpUI.open();}
    catch(e){console.warn('[ETRANOM] PvP UI unavailable:',e);window.etranomOpenPvP=()=>alert('تالار PvP بارگذاری نشد.');}
    await refreshNotificationCounts();
    startNotificationRealtime();
    try{
      const {ETRANOMPresence}=await import('./systems/online/presence.js');
      const presence=new ETRANOMPresence(supabase,currentUser,info=>{const el=document.getElementById('etr-online-indicator');if(el){const connected=info.status==='SUBSCRIBED';el.textContent=connected?`● جهان متصل | ${info.onlineCount} بازیکن یکتا | ${info.sessionCount} نشست`:`◌ ${info.status==='CONNECTING'?'در حال اتصال':info.status==='DISCONNECTING'?'در حال خروج':'اتصال ناپایدار'} | وضعیت‌ها موقتاً به‌روزرسانی نمی‌شوند`;el.dataset.connected=connected?'true':'false';if(socialTab==='friends'&&socialOverview)renderSocial();}});
      window.etranomPresence=presence;await presence.start();
      try{const {ETRANOMWorldPresence}=await import('./systems/online/world-presence.js');const worldPresence=new ETRANOMWorldPresence({supabase,user:currentUser,onChange:players=>window.dispatchEvent(new CustomEvent('etranom:world-presence',{detail:{players}}))});window.etranomWorldPresence=worldPresence;await worldPresence.start();}
      catch(e){console.warn('[ETRANOM] Map presence unavailable:',e);}
    }catch(e){console.warn('[ETRANOM] Online presence unavailable:',e);}
    if(!socialLaunch.isConnected)document.body.appendChild(socialLaunch);
    if(!socialOverlay.isConnected)document.body.appendChild(socialOverlay);
    if(!guildLaunch.isConnected)document.body.appendChild(guildLaunch);
    guildTeacherVisited=sessionStorage.getItem('etranom:guildTeacherVisited')==='1';
    const { loadRegionOneRuntime } = await import('./systems/content/region-one-runtime.js?v=2');
    await loadRegionOneRuntime();
    await import('./game.js?v=42');
    const gameRunner=window.run;
    if(typeof gameRunner!=='function')throw new Error('موتور بازی تابع window.run را ثبت نکرد.');
    await gameRunner('play');
    gameRoot.classList.add('etr-game-ready');
    gate.classList.add('hidden');
    started=true;
  }catch(e){
    started=false;
    gameRoot.classList.remove('etr-game-ready');
    gameRoot.replaceChildren();
    gate.classList.remove('hidden');
    const detail=String(e?.message||e||'خطای ناشناخته').slice(0,180);
    say('ورود انجام شد، اما اجرای بازی کامل نشد: '+detail+' — صفحه ورود را باز نگه داشتیم؛ دوباره تلاش کن.');
    console.error('[ETRANOM] Startup failed:',e);
    throw e;
  }
}
// Prevent overlapping startup attempts (for example, a manual login racing with session recovery).
function start(session){
  if(started)return Promise.resolve();
  if(startupPromise)return startupPromise;
  startupPromise=startSession(session).finally(()=>{startupPromise=null;});
  return startupPromise;
}
async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password){say('ایمیل و گذرواژه را وارد کن.');return;}setBusy(true);say('در حال ورود...');try{const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error)throw error;if(!data?.session)throw new Error('نشست ورود از سرویس دریافت نشد؛ دوباره تلاش کن.');await start(data.session);}catch(e){say(e.message==='Invalid login credentials'?'ایمیل یا گذرواژه نادرست است.':`ورود انجام نشد: ${e.message||'خطای نامشخص'}`);}finally{setBusy(false);}}
async function signup(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password){say('ایمیل و گذرواژه را وارد کن.');return;}if(password.length<6){say('ایمیل معتبر و گذرواژه حداقل ۶ نویسه‌ای وارد کن.');return;}setBusy(true);say('در حال ساخت حساب...');try{const {data,error}=await supabase.auth.signUp({email,password});if(error)throw error;if(data.session)await start(data.session);else say('حساب ساخته شد، اما نشست ورود دریافت نشد. تنظیم تأیید ایمیل را بررسی کن یا با همان ایمیل و گذرواژه وارد شو.');}catch(e){say(`ساخت حساب انجام نشد: ${e.message}`);}finally{setBusy(false);}}
form.addEventListener('submit',e=>{e.preventDefault();login();});signupBtn.addEventListener('click',e=>{e.preventDefault();signup();});
supabase.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){started=false;currentUser=null;document.getElementById('etr-game-root')?.classList.remove('etr-game-ready');gate.classList.remove('hidden');window.location.reload();}});
const {data:{session},error}=await supabase.auth.getSession();if(error){say('بازیابی نشست انجام نشد؛ ایمیل و گذرواژه را وارد کن.');}else if(session){const {data:{user},error:verifyError}=await supabase.auth.getUser();if(!verifyError&&user&&user.id===session.user.id){await start({...session,user});}else{await supabase.auth.signOut({scope:'local'});currentUser=null;started=false;say('نشست قبلی معتبر نیست. برای ورود، ایمیل و گذرواژه را وارد کن.');}}
</script>
